<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline Event Tracker - Socio-O-Thon</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      padding: 16px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .badge {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .main {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Snap Photo Camera Trigger */
    .snap-container {
      background: #1e293b;
      border-radius: 16px;
      padding: 22px 18px;
      border: 1px solid #334155;
      text-align: center;
      margin-bottom: 16px;
    }
    .snap-btn-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    .snap-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 20px;
      border-radius: 12px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4);
      cursor: pointer;
    }
    .snap-btn:active {
      transform: scale(0.98);
      background: #1d4ed8;
    }
    #qrFileInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
    .scanning-spinner {
      margin-top: 12px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
      display: none;
    }

    /* Participant Card Popup */
    .card-panel {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 2px solid #38bdf8;
      margin-bottom: 16px;
      display: none;
    }
    .card-panel.active { display: block; animation: slideIn 0.2s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .card-id { font-size: 26px; font-weight: 800; color: #38bdf8; margin: 0; }
    .card-name { color: #94a3b8; font-size: 14px; margin: 4px 0 0; }
    
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      cursor: pointer;
    }
    .check-label {
      font-weight: 600;
      font-size: 16px;
    }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(22px); }

    .status-msg {
      font-size: 14px;
      color: #10b981;
      text-align: center;
      font-weight: 600;
      min-height: 20px;
      margin-bottom: 10px;
    }

    /* Manual search / input */
    .manual-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .manual-box input {
      flex: 1;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .manual-box input:focus { border-color: #38bdf8; }
    .btn-secondary {
      background: #334155;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Summary Bar & Export */
    .summary-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #334155;
      margin-bottom: 24px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
    }
    .summary-item {
      background: #0f172a;
      padding: 12px 4px;
      border-radius: 8px;
    }
    .summary-val { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .summary-lbl { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-size: 11px; color: #94a3b8; font-weight: 800; letter-spacing: 1px;">SOCIO-O-THON</div>
      <h1>Event Check-In & Scanner</h1>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="index.html" class="btn-secondary" style="padding:6px 12px; font-size:12px; text-decoration:none; display:flex; align-items:center; gap:4px;">📊 QR Dashboard</a>
      <span id="connectionBadge" class="badge">Live Sync</span>
    </div>
  </header>

  <div class="main">
    <!-- Camera Snap Trigger -->
    <div class="snap-container">
      <div class="snap-btn-wrapper">
        <button class="snap-btn">📷 Snap QR Code</button>
        <input type="file" id="qrFileInput" accept="image/*" capture="environment" onchange="handleQrPhoto(event)" />
      </div>
      <div class="hint">Tap to take photo of badge or upload QR</div>
      <div id="scanningSpinner" class="scanning-spinner">⏳ Reading QR from photo...</div>
    </div>

    <!-- Active Participant Action Panel -->
    <div id="cardPanel" class="card-panel">
      <div class="card-header">
        <div>
          <div style="display:flex; align-items:center; gap:8px;">
            <h2 class="card-id" id="displayId">SOT001</h2>
            <span id="displayRoom" style="background:#2563eb; color:#fff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; display:none;">LR...</span>
          </div>
          <div class="card-name" id="displayName">Participant Name</div>
          <div id="displayMeta" style="font-size:12px; color:#94a3b8; margin-top:4px;"></div>
        </div>
        <button class="btn-secondary" style="padding:6px 10px; font-size:12px;" onclick="closePanel()">✕ Done</button>
      </div>

      <div class="checklist">
        <label class="check-item">
          <span class="check-label">🎁 Kit Received</span>
          <div class="toggle-switch">
            <input type="checkbox" id="checkKit" onchange="autoSaveCurrent()" />
            <span class="slider"></span>
          </div>
        </label>

        <label class="check-item">
          <span class="check-label">🛏️ Accommodation</span>
          <div class="toggle-switch">
            <input type="checkbox" id="checkAcc" onchange="autoSaveCurrent()" />
            <span class="slider"></span>
          </div>
        </label>

        <label class="check-item">
          <span class="check-label">🍱 Food Taken</span>
          <div class="toggle-switch">
            <input type="checkbox" id="checkFood" onchange="autoSaveCurrent()" />
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- Manual ID search fallback -->
    <div class="manual-box">
      <input type="text" id="manualId" placeholder="Or type ID directly (e.g. SOT001)" />
      <button class="btn-secondary" onclick="searchManual()">Open</button>
    </div>

    <!-- Summary Stats & CSV Export -->
    <div class="summary-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-weight:700; font-size:14px;">Live Progress</div>
        <button id="refreshBtn" onclick="syncWithGoogleSheet()" class="btn-secondary" style="padding:4px 8px; font-size:11px;">🔄 Sync Sheet</button>
      </div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-val" id="kitCount">0</div>
          <div class="summary-lbl">Kits Given</div>
        </div>
        <div class="summary-item">
          <div class="summary-val" id="accCount">0</div>
          <div class="summary-lbl">Accommodations</div>
        </div>
        <div class="summary-item">
          <div class="summary-val" id="foodCount">0</div>
          <div class="summary-lbl">Food Provided</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" style="flex:1; font-size:13px;" onclick="exportCSV()">📥 Export to Excel</button>
        <button class="btn-secondary" style="flex:1; font-size:13px;" onclick="exportJSON()">💾 Backup JSON</button>
      </div>
    </div>
  </div>

  <canvas id="qrCanvas"></canvas>

  <script src="data/seed.js?v=8.5"></script>
  <script>
    const GOOGLE_SHEET_GVIZ_URL = "https://docs.google.com/spreadsheets/d/1_l9WvZ9ZJzhhij0QR0IRe388gP2lt-RNctH2qeErW9U/gviz/tq";
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbw7p21WbHuWVn3iclq8PUCjpfDZrCXQEkpZMuV8TruuZtNcIJjzU1zw5hNEiVtJqUVg/exec";
    const STORAGE_KEY = "offline_socio_participants_v8";
    let db = {};
    let currentParticipantId = null;

    function isTruthy(val) {
      if (!val) return false;
      const s = String(val).trim().toUpperCase();
      return s === "YES" || s === "TRUE" || s === "1" || s === "CHECKED" || s === "Y" || s === "DONE" || s === "RECEIVED" || s === "✓" || s === "✔";
    }

    function fetchLiveSheetJsonp() {
      return new Promise((resolve) => {
        const callbackName = "gvizSheetCallbackScanner_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let resolved = false;

        const timeout = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            cleanup();
            resolve(null);
          }
        }, 6000);

        function cleanup() {
          clearTimeout(timeout);
          try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          if (resolved) return;
          resolved = true;
          cleanup();
          try {
            if (!data || !data.table || !data.table.rows) return resolve(null);
            const cols = data.table.cols.map(c => (c.label || c.id || '').trim());
            const rows = data.table.rows;
            const idCol = cols.findIndex(h => /participant\s*id/i.test(h));
            const teamIdCol = cols.findIndex(h => /socio\s*team\s*id/i.test(h) || /^team\s*id$/i.test(h));
            const nameCol = cols.findIndex(h => /^name$/i.test(h));
            const kitCol = cols.findIndex(h => /kit/i.test(h));
            const accCol = cols.findIndex(h => /accommodation/i.test(h));
            const foodCol = cols.findIndex(h => /food/i.test(h));

            const list = [];
            rows.forEach(r => {
              const cells = r.c || [];
              const getVal = (idx) => {
                if (idx === -1 || !cells[idx]) return '';
                const cell = cells[idx];
                return (cell.f !== undefined && cell.f !== null) ? String(cell.f).trim() : (cell.v !== undefined && cell.v !== null ? String(cell.v).trim() : '');
              };
              const id = getVal(idCol).toUpperCase();
              if (!id) return;
              const name = getVal(nameCol) || ('Participant ' + id);
              let teamId = getVal(teamIdCol) || '';
              if (teamId === '-') teamId = '';
              const status = {
                kit: isTruthy(getVal(kitCol)),
                accommodation: isTruthy(getVal(accCol)),
                food: isTruthy(getVal(foodCol))
              };
              const fields = {};
              cols.forEach((colName, cIdx) => {
                if (cIdx === idCol || cIdx === nameCol || cIdx === kitCol || cIdx === accCol || cIdx === foodCol) return;
                if (!colName || /last\s*updated/i.test(colName)) return;
                const val = getVal(cIdx);
                if (val && val !== '-') fields[colName] = val;
              });
              if (!teamId && fields['Socio Team ID']) teamId = fields['Socio Team ID'];
              list.push({ id, name, teamId, status, fields });
            });
            resolve(list);
          } catch (e) {
            console.warn("Scanner Gviz parse error:", e);
            resolve(null);
          }
        };

        script.onerror = function() {
          if (!resolved) {
            resolved = true;
            cleanup();
            resolve(null);
          }
        };

        script.src = `${GOOGLE_SHEET_GVIZ_URL}?tqx=responseHandler:${callbackName}&_t=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    async function syncWithGoogleSheet() {
      const badge = document.getElementById("connectionBadge");
      const refreshBtn = document.getElementById("refreshBtn");
      if (refreshBtn) refreshBtn.textContent = "⏳ Syncing...";
      try {
        const liveList = await fetchLiveSheetJsonp();
        if (liveList && Array.isArray(liveList) && liveList.length > 0) {
          liveList.forEach(p => {
            db[p.id] = {
              id: p.id,
              name: p.name,
              teamId: p.teamId || (p.fields ? p.fields['Socio Team ID'] : ''),
              room: p.fields ? (p.fields['AB2 (SOCI-O-THON)'] || p.fields['AB2'] || '') : '',
              theme: p.fields ? (p.fields['Theme'] || '') : '',
              kit: p.status ? !!p.status.kit : false,
              acc: p.status ? !!p.status.accommodation : false,
              food: p.status ? !!p.status.food : false,
              fields: p.fields || {}
            };
          });
          saveDatabase();
          if (badge) {
            badge.style.background = "#10b981";
            badge.textContent = `🟢 Live (${liveList.length})`;
          }
        } else {
          if (badge) badge.textContent = "Offline (Cached)";
        }
      } catch (e) {
        console.warn("Sheet sync note:", e);
        if (badge) badge.textContent = "Offline (Cached)";
      }
      if (refreshBtn) refreshBtn.textContent = "🔄 Sync Sheet";
      updateStats();
      if (currentParticipantId && db[currentParticipantId]) {
        openParticipant(currentParticipantId);
      }
    }

    function loadDatabase() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try { db = JSON.parse(stored); } catch (e) { db = {}; }
      }
      if (!Object.keys(db).length && window.SOCIO_DEFAULT_PARTICIPANTS && Array.isArray(window.SOCIO_DEFAULT_PARTICIPANTS)) {
        window.SOCIO_DEFAULT_PARTICIPANTS.forEach(p => {
          db[p.id] = {
            id: p.id,
            name: p.name,
            teamId: p.fields ? p.fields['Socio Team ID'] : '',
            room: p.fields ? (p.fields['AB2 (SOCI-O-THON)'] || p.fields['AB2'] || '') : '',
            theme: p.fields ? (p.fields['Theme'] || '') : '',
            kit: p.status ? !!p.status.kit : false,
            acc: p.status ? !!p.status.accommodation : false,
            food: p.status ? !!p.status.food : false,
            fields: p.fields || {}
          };
        });
        saveDatabase();
      }
      updateStats();
      // Fetch live data from Google Sheet in background immediately!
      syncWithGoogleSheet();
      // Auto-poll every 20 seconds to stay in sync
      setInterval(syncWithGoogleSheet, 20000);
    }

    function saveDatabase() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      updateStats();
    }

    function updateStats() {
      let kit = 0, acc = 0, food = 0;
      Object.values(db).forEach(p => {
        if (p.kit) kit++;
        if (p.acc) acc++;
        if (p.food) food++;
      });
      document.getElementById("kitCount").textContent = kit;
      document.getElementById("accCount").textContent = acc;
      document.getElementById("foodCount").textContent = food;
    }

    function openParticipant(rawText) {
      let text = String(rawText || "").trim();
      let id = "";
      if (text.includes("id=")) {
        id = text.split("id=")[1].split("&")[0].split("#")[0];
      } else if (text.includes("/p/")) {
        id = text.split("/p/")[1].split("?")[0].split("#")[0];
      } else {
        id = text;
      }
      id = decodeURIComponent(id).replace(/[^a-zA-Z0-9_\-\/]/g, "").trim().toUpperCase();
      if (!id) return;

      if (!db[id]) {
        // Try numeric match
        const numTarget = parseInt(id.replace(/\D/g, ""), 10);
        const match = Object.values(db).find(x => {
          const n = parseInt(String(x.id).replace(/\D/g, ""), 10);
          return !isNaN(n) && !isNaN(numTarget) && n === numTarget;
        });
        if (match) {
          id = match.id;
        } else {
          db[id] = { id: id, name: "Participant " + id, kit: false, acc: false, food: false, fields: {} };
          saveDatabase();
        }
      }
      currentParticipantId = id;
      const p = db[id];

      document.getElementById("displayId").textContent = p.id;
      document.getElementById("displayName").textContent = p.name;

      const roomEl = document.getElementById("displayRoom");
      const roomVal = p.room || (p.fields ? (p.fields['AB2 (SOCI-O-THON)'] || p.fields['AB2']) : '');
      if (roomVal) {
        roomEl.textContent = roomVal;
        roomEl.style.display = "inline-block";
      } else {
        roomEl.style.display = "none";
      }

      const metaEl = document.getElementById("displayMeta");
      const teamVal = p.teamId || (p.fields ? p.fields['Socio Team ID'] : '');
      const themeVal = p.theme || (p.fields ? p.fields['Theme'] : '');
      let metaParts = [];
      if (teamVal) metaParts.push(`<strong>Team:</strong> ${teamVal}`);
      if (themeVal) metaParts.push(`<strong>Theme:</strong> ${themeVal}`);
      metaEl.innerHTML = metaParts.join(" &bull; ");

      document.getElementById("checkKit").checked = !!p.kit;
      document.getElementById("checkAcc").checked = !!p.acc;
      document.getElementById("checkFood").checked = !!p.food;

      document.getElementById("cardPanel").classList.add("active");
      document.getElementById("cardPanel").scrollIntoView({ behavior: 'smooth' });
      document.getElementById("statusMsg").textContent = "";

      if (navigator.vibrate) navigator.vibrate(100);
    }

    async function autoSaveCurrent() {
      if (!currentParticipantId || !db[currentParticipantId]) return;
      const p = db[currentParticipantId];
      p.kit = document.getElementById("checkKit").checked;
      p.acc = document.getElementById("checkAcc").checked;
      p.food = document.getElementById("checkFood").checked;
      saveDatabase();
      
      const msg = document.getElementById("statusMsg");
      msg.textContent = "⏳ Syncing to Google Sheet...";

      try {
        await fetch(GOOGLE_SHEET_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "sync_status",
            id: p.id,
            kit: p.kit,
            accommodation: p.acc,
            food: p.food,
            fields: p.fields || {}
          })
        });
        msg.textContent = "✅ Saved & Synced to Google Sheet!";
        setTimeout(() => {
          if (msg.textContent.includes("Synced")) msg.textContent = "";
        }, 2000);
      } catch (err) {
        msg.textContent = "💾 Saved locally (offline)";
      }
    }

    function closePanel() {
      document.getElementById("cardPanel").classList.remove("active");
      currentParticipantId = null;
    }

    function searchManual() {
      const input = document.getElementById("manualId").value;
      if (input) {
        openParticipant(input);
        document.getElementById("manualId").value = "";
      }
    }

    // High performance photo decoder with auto-resizing & native BarcodeDetector
    async function handleQrPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const spinner = document.getElementById("scanningSpinner");
      spinner.style.display = "block";

      try {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        // 1. First attempt: Use fast native phone BarcodeDetector (Chrome/Android/iOS native)
        if ('BarcodeDetector' in window) {
          try {
            const detector = new BarcodeDetector({ formats: ['qr_code'] });
            const barcodes = await detector.detect(img);
            if (barcodes.length > 0) {
              spinner.style.display = "none";
              openParticipant(barcodes[0].rawValue);
              document.getElementById("qrFileInput").value = "";
              return;
            }
          } catch (e) {
            console.log("Native barcode detector fallback:", e);
          }
        }

        // 2. Second attempt: Auto-downscale image to ~900px so jsQR decodes in milliseconds
        const maxDim = 900;
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        const canvas = document.getElementById("qrCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        
        if (typeof jsQR !== "undefined") {
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });
          spinner.style.display = "none";
          if (code) {
            openParticipant(code.data);
          } else {
            alert("⚠️ Could not detect QR code in that photo. Please try taking the photo closer or more directly in front of the badge.");
          }
        } else {
          spinner.style.display = "none";
          alert("QR Decoder is loading. Please retry in a few seconds.");
        }
      } catch (err) {
        spinner.style.display = "none";
        alert("Error analyzing photo: " + err.message);
      } finally {
        document.getElementById("qrFileInput").value = "";
      }
    }

    // Export Data Back to Laptop (CSV / JSON)
    function exportCSV() {
      let csv = "ID,Name,Kit Received,Accommodation,Food Received\n";
      Object.values(db).forEach(p => {
        csv += `"${p.id}","${p.name}","${p.kit ? 'YES' : 'NO'}","${p.acc ? 'YES' : 'NO'}","${p.food ? 'YES' : 'NO'}"\n`;
      });
      downloadFile(csv, "socio-o-thon-status.csv", "text/csv");
    }

    function exportJSON() {
      const json = JSON.stringify(db, null, 2);
      downloadFile(json, "socio-o-thon-status.json", "application/json");
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadDatabase();
  </script>
</body>
</html>
