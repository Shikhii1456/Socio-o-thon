<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socio-O-Thon - Print Participant ID Badges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      color: #1a1a1a;
    }
    .no-print {
      max-width: 900px;
      margin: 0 auto 24px;
      background: #fff;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-row h1 { margin: 0; font-size: 20px; }
    .header-row p { margin: 4px 0 0; color: #666; font-size: 13px; }
    
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .add-form {
      display: flex;
      flex: 1;
      gap: 8px;
      min-width: 300px;
    }
    .add-form input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    .input-id { width: 110px; text-transform: uppercase; font-weight: 700; }
    .input-name { flex: 1; }

    .btn {
      background: #111827;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #374151; }
    .btn-green { background: #059669; }
    .btn-green:hover { background: #047857; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      page-break-inside: avoid;
    }
    .card-info {
      flex: 1;
      padding-right: 15px;
    }
    .event-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #4f46e5;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .participant-id {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px 0;
    }
    .participant-name {
      font-size: 16px;
      color: #475569;
      margin: 0 0 12px 0;
      font-weight: 500;
    }
    .check-boxes {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }
    .check-box-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .square {
      width: 14px;
      height: 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 3px;
    }
    .qr-container {
      width: 135px;
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #fff;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .badge-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 100%;
      }
      .card {
        border: 1.5px solid #94a3b8;
        border-radius: 8px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div class="header-row">
      <div>
        <h1>🪪 Participant ID Badges</h1>
        <p>Connected to live cloud database. Scan with iPhone camera to view and mark status.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <a href="index.html" class="btn btn-secondary">Dashboard</a>
        <button class="btn btn-green" onclick="exportExcelCSV()">📥 Export to Excel (CSV)</button>
        <button class="btn" onclick="window.print()">🖨️ Print All Badges</button>
      </div>
    </div>

    <!-- Inline Add Participant Form directly on Print Badges page -->
    <div class="actions-bar">
      <form class="add-form" id="addBadgeForm" onsubmit="event.preventDefault(); handleAddParticipant();">
        <input type="text" id="newId" class="input-id" placeholder="ID (e.g. SOT006)" required />
        <input type="text" id="newName" class="input-name" placeholder="Participant Full Name" required />
        <button type="submit" id="addBtn" class="btn" style="background:#2563eb;">+ Add Badge</button>
      </form>
    </div>
  </div>

  <div class="badge-grid" id="badgeContainer"></div>

  <script>
    const CLOUD_DB_URL = "https://api.restful-api.dev/objects/ff808181a09d98f701a1156100f012a9";
    const LOCAL_STORAGE_KEY = "socioOthon_shared_participants";
    let participantsList = [];

    function getParticipantUrl(id) {
      const base = window.location.href.split("?")[0].split("#")[0].replace(/\/(print-cards\.html)?$/, "");
      return `${base}/participant.html?id=${encodeURIComponent(id)}`;
    }

    async function fetchParticipants() {
      try {
        const res = await fetch(CLOUD_DB_URL);
        if (res.ok) {
          const json = await res.json();
          if (json && json.data && Array.isArray(json.data.participants)) {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(json.data.participants));
            return json.data.participants;
          }
        }
      } catch (err) {}
      const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return [
        { id: "SOT001", name: "Participant 001", status: { kit: false, accommodation: false, food: false } },
        { id: "SOT002", name: "Participant 002", status: { kit: false, accommodation: false, food: false } },
        { id: "SOT003", name: "Participant 003", status: { kit: false, accommodation: false, food: false } },
        { id: "SOT004", name: "Participant 004", status: { kit: false, accommodation: false, food: false } },
        { id: "SOT005", name: "Participant 005", status: { kit: false, accommodation: false, food: false } }
      ];
    }

    async function loadAndRender() {
      participantsList = await fetchParticipants();
      const container = document.getElementById("badgeContainer");
      container.innerHTML = "";

      // Prefill next suggested ID in add box
      const nextNum = participantsList.length + 1;
      document.getElementById("newId").value = `SOT${String(nextNum).padStart(3, "0")}`;

      participantsList.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";

        const qrId = `qr-badge-${p.id}`;
        const pUrl = getParticipantUrl(p.id);

        card.innerHTML = `
          <div class="card-info">
            <div class="event-tag">SOCIO-O-THON</div>
            <h2 class="participant-id">${p.id}</h2>
            <div class="participant-name">${p.name}</div>
            <div class="check-boxes">
              <div class="check-box-item"><span class="square"></span> Kit</div>
              <div class="check-box-item"><span class="square"></span> Accom.</div>
              <div class="check-box-item"><span class="square"></span> Food</div>
            </div>
            <div style="margin-top:8px; font-size:10px; color:#94a3b8; word-break:break-all;">${pUrl}</div>
          </div>
          <div class="qr-container" id="${qrId}"></div>
        `;
        container.appendChild(card);

        new QRCode(document.getElementById(qrId), {
          text: pUrl,
          width: 130,
          height: 130,
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    async function handleAddParticipant() {
      const idInput = document.getElementById("newId");
      const nameInput = document.getElementById("newName");
      const addBtn = document.getElementById("addBtn");

      const id = idInput.value.trim().toUpperCase();
      const name = nameInput.value.trim();
      if (!id || !name) return;

      addBtn.textContent = "Adding...";
      addBtn.disabled = true;

      const list = await fetchParticipants();
      if (!list.find(p => p.id === id)) {
        list.push({
          id: id,
          name: name,
          status: { kit: false, accommodation: false, food: false }
        });
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));

        try {
          await fetch(CLOUD_DB_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: "socio-o-thon-db",
              data: { participants: list }
            })
          });
        } catch (e) {}
      }

      nameInput.value = "";
      addBtn.textContent = "+ Add Badge";
      addBtn.disabled = false;

      await loadAndRender();
    }

    function exportExcelCSV() {
      let csv = "\uFEFFParticipant ID,Name,Kit Received,Accommodation,Food Received,Total Completed\n";
      participantsList.forEach(p => {
        const kit = p.status && p.status.kit ? "YES" : "NO";
        const acc = p.status && p.status.accommodation ? "YES" : "NO";
        const food = p.status && p.status.food ? "YES" : "NO";
        const total = [p.status && p.status.kit, p.status && p.status.accommodation, p.status && p.status.food].filter(Boolean).length;
        csv += `"${p.id}","${p.name.replace(/"/g, '""')}","${kit}","${acc}","${food}","${total}/3"\n`;
      });
      
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Socio-O-Thon-Badges-${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    loadAndRender();
  </script>
</body>
</html>
