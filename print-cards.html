<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socio-O-Thon - Print Participant ID Badges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      color: #1a1a1a;
    }
    .no-print {
      max-width: 900px;
      margin: 0 auto 24px;
      background: #fff;
      padding: 18px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .no-print h1 {
      margin: 0;
      font-size: 20px;
    }
    .no-print p {
      margin: 4px 0 0;
      color: #666;
      font-size: 13px;
    }
    .btn {
      background: #111827;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #374151; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      page-break-inside: avoid;
    }
    .card-info {
      flex: 1;
      padding-right: 15px;
    }
    .event-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #4f46e5;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .participant-id {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px 0;
    }
    .participant-name {
      font-size: 16px;
      color: #475569;
      margin: 0 0 12px 0;
      font-weight: 500;
    }
    .check-boxes {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
    }
    .check-box-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .square {
      width: 14px;
      height: 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 3px;
    }
    .qr-container {
      width: 135px;
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #fff;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .badge-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 100%;
      }
      .card {
        border: 1.5px solid #94a3b8;
        border-radius: 8px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div>
      <h1>🪪 Participant ID Badges</h1>
      <p>Scan with your iPhone Camera to open the participant's record on GitHub Pages.</p>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="index.html" class="btn" style="background:#475569; text-decoration:none;">Dashboard</a>
      <button class="btn" onclick="window.print()">🖨️ Print ID Badges</button>
    </div>
  </div>

  <div class="badge-grid" id="badgeContainer"></div>

  <script>
    // Compute permanent link pointing to participant.html
    function getParticipantUrl(id) {
      const base = window.location.href.split("?")[0].split("#")[0].replace(/\/(print-cards\.html)?$/, "");
      return `${base}/participant.html?id=${encodeURIComponent(id)}`;
    }

    async function loadAndRender() {
      let list = [];
      const STORAGE_KEY = "socioOthon_shared_participants";

      try {
        const res = await fetch("./api/participants");
        if (res.ok) list = await res.json();
      } catch (e) {}

      if (!list || list.length === 0) {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          list = JSON.parse(saved);
        } else {
          list = [
            { id: "SOT001", name: "Participant 001" },
            { id: "SOT002", name: "Participant 002" },
            { id: "SOT003", name: "Participant 003" },
            { id: "SOT004", name: "Participant 004" },
            { id: "SOT005", name: "Participant 005" }
          ];
        }
      }

      const container = document.getElementById("badgeContainer");
      container.innerHTML = "";

      list.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";

        const qrId = `qr-badge-${p.id}`;
        const pUrl = getParticipantUrl(p.id);

        card.innerHTML = `
          <div class="card-info">
            <div class="event-tag">SOCIO-O-THON</div>
            <h2 class="participant-id">${p.id}</h2>
            <div class="participant-name">${p.name}</div>
            <div class="check-boxes">
              <div class="check-box-item"><span class="square"></span> Kit</div>
              <div class="check-box-item"><span class="square"></span> Accom.</div>
              <div class="check-box-item"><span class="square"></span> Food</div>
            </div>
            <div style="margin-top:8px; font-size:10px; color:#94a3b8; word-break:break-all;">${pUrl}</div>
          </div>
          <div class="qr-container" id="${qrId}"></div>
        `;
        container.appendChild(card);

        // QR Code generates the real permanent HTTPS web link
        new QRCode(document.getElementById(qrId), {
          text: pUrl,
          width: 130,
          height: 130,
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    loadAndRender();
  </script>
</body>
</html>
